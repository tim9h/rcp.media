name: Java CI with Maven

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      PACKAGES_READ_USERNAME: ${{ secrets.PACKAGES_READ_USERNAME }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        if: github.event_name == 'pull_request'
        run: mvn -B -s .mvn/settings.xml verify

      - name: Build, test and build Maven package
        if: github.event_name == 'push'
        run: mvn -B -s .mvn/settings.xml package

      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(mvn -B -q -s .mvn/settings.xml help:evaluate -Dexpression=project.version -DforceStdout)
          ARTIFACT="target/rcp.media-${VERSION}.jar"
          gh release delete "v${VERSION}" --cleanup-tag --yes || true
          gh release create "v${VERSION}" "${ARTIFACT}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes